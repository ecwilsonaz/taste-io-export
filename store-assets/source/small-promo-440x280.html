<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=440, initial-scale=1">
    <title>Taste.io Ratings Exporter — Small promo tile</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        padding: 30px 34px;
        color: #f5f6f2;
        background:
          radial-gradient(circle at 8% -10%, rgb(175 242 118 / 23%), transparent 54%),
          radial-gradient(circle at 100% 100%, rgb(175 242 118 / 8%), transparent 45%),
          #0c0d0c;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body::after {
        content: "";
        position: absolute;
        right: -42px;
        bottom: -70px;
        width: 210px;
        height: 210px;
        border: 1px solid rgb(175 242 118 / 10%);
        border-radius: 50%;
        box-shadow: 0 0 0 28px rgb(175 242 118 / 3%), 0 0 0 64px rgb(175 242 118 / 2%);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 10px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
      .mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid #484c48;
        border-radius: 10px;
        background: #181a18;
      }
      .mark svg { width: 19px; height: 19px; }
      h1 { margin: 28px 0 0; font-size: 44px; line-height: .94; letter-spacing: -.055em; }
      .footer { display: flex; gap: 9px; align-items: center; margin-top: 24px; color: #aeb3ab; font-size: 12px; font-weight: 650; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #aff276; box-shadow: 0 0 0 5px rgb(175 242 118 / 10%); }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m-5-5 5 5 5-5M5 20h14" stroke="#aff276" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Taste.io Ratings Exporter
    </div>
    <h1>Every rating.<br>One clean CSV.</h1>
    <div class="footer"><span class="dot"></span>Private by design · Movies + TV</div>
  </body>
</html>
