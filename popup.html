<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taste.io Ratings Exporter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">Taste.io Ratings Exporter</p>
      <h1>Your ratings, in a CSV.</h1>
      <p id="message">Open your Taste.io ratings page, then export the complete list.</p>
      <button id="export" type="button" disabled>Export all ratings</button>
      <a id="open-taste" href="https://www.taste.io/" target="_blank" rel="noreferrer">Open Taste.io</a>
      <p class="privacy">The export runs in your browser. Nothing is uploaded.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
